name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:ci

      - name: Audit production and development dependencies
        run: npm run audit

  commit-messages:
    name: Conventional commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        run: |
          pattern='^(feat|fix|docs|refactor|test|build|ci|perf|chore|style|revert)(\([^)]+\))?!?: .+'
          status=0
          for subject in $(git log --format=%H ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            msg=$(git log -1 --format=%s "$subject")
            case "$msg" in Merge*) continue ;; esac
            if ! echo "$msg" | grep -Eq "$pattern"; then echo "Not conventional: $msg"; status=1; fi
          done
          exit $status

  ml-unit-tests:
    name: ML preprocessing tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/prediction/test-requirements.txt

      - name: Install test dependencies
        run: pip install -r services/prediction/test-requirements.txt

      - name: Run ML unit tests
        run: python -m unittest discover -s services/prediction/tests -v

      - name: Run KPLC parser validation tests
        run: python -m unittest discover -s services/kplc/scraper/tests -v

  android-build:
    name: Android debug build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Compile Android debug app
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
